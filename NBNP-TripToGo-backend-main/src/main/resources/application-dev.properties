# Database settings
spring.datasource.url=jdbc:mysql://localhost:3308/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# Hibernate dev-specific settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Swagger (enabled in dev)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.version=OPENAPI_3_0
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# File saving
file.storageDirectory=${user.dir}/file-storage
file.maxFileSize=5
file.extensions=jpg,png,jpeg
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=1024MB

# S3
aws.access.key=${YOUR_ACCESS_KEY}
aws.secret.key=${YOUR_SECRET_KEY}
aws.public.bucket=trip-to-go-public-bucket
aws.private.bucket=triptogoprivatebucket

# Migrations (same location for all environments)
spring.flyway.locations=filesystem:flyway/sql
spring.flyway.enabled=true