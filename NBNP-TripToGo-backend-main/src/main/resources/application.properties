# Application name
spring.application.name=Trip To Go Backend Service

# Import environmental variables into application properties
spring.config.import=optional:file:.env[.properties]

# MySQL driver (common across all environments)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate common settings
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT (common secret key loaded from environment)
jwt.secret=${JWT_SECRET_KEY}

# Static resources (common behavior)
spring.web.resources.static-locations=classpath:/static-none/
spring.web.resources.add-mappings=false