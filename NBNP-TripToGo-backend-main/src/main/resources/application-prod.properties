spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:3306/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

file.storageDirectory=${user.dir}/file-storage
file.maxFileSize=5
file.extensions=jpg,png,jpeg

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=1024MB

aws.access.key=${YOUR_ACCESS_KEY}
aws.secret.key=${YOUR_SECRET_KEY}
aws.public.bucket=trip-to-go-public-bucket
aws.private.bucket=triptogoprivatebucket

spring.flyway.enabled=false