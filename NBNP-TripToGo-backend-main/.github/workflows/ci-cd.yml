name: CI/CD Pipeline for Trip To Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Verify Java version
        run: java -version
      - name: Verify Maven version
        run: mvn -version
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build and test
        run: mvn clean install -DskipTests=false
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          AWS_ACCESS_KEY: ${{ secrets.YOUR_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.YOUR_SECRET_ACCESS_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      - name: Verify JAR artifact exists
        run: |
          if [ ! -f target/trip-to-go-0.0.1-SNAPSHOT.jar ]; then
            echo "JAR file does not exist!"
            exit 1
          else
            echo "JAR file exists!"
          fi
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: trip-to-go-jar
          path: target/trip-to-go-0.0.1-SNAPSHOT.jar

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: trip-to-go-jar
          path: target/

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/trip-to-go-0.0.1-SNAPSHOT.jar"
          target: "/home/ec2-user/"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e  # Exit on error
            sudo systemctl stop trip-to-go || true
            cat <<EOF > /home/ec2-user/env.sh
            #!/bin/bash
            export MYSQL_HOST=${{ secrets.MYSQL_HOST }}
            export MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
            export MYSQL_USER=${{ secrets.MYSQL_USER }}
            export MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            export JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            export YOUR_ACCESS_KEY=${{ secrets.YOUR_ACCESS_KEY }}
            export YOUR_SECRET_KEY=${{ secrets.YOUR_SECRET_ACCESS_KEY }}
            export SPRING_PROFILES_ACTIVE=prod
            EOF
            chmod +x /home/ec2-user/env.sh
            sudo systemctl daemon-reload
            sudo systemctl restart trip-to-go
            sleep 10
            sudo systemctl status trip-to-go --no-pager
            echo "Deployment complete."
